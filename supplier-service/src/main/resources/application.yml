server:
  port: 8085

spring:
  application:
    name: supplier-service
  datasource:
    url: ${SUPPLIER_DB_URL:jdbc:mysql://localhost:3306/supplier_db}
    username: ${SUPPLIER_DB_USERNAME:root}
    password: ${SUPPLIER_DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: localhost

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:86400000}
