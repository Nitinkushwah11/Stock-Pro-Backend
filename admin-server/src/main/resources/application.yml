server:
  port: 9090

spring:
  application:
    name: admin-server
  boot:
    admin:
      discovery:
        enabled: true
        ignored-services: admin-server

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,loggers
  endpoint:
    health:
      show-details: always
  info:
    env:
      enabled: true

info:
  app:
    name: admin-server
    description: StockPro monitoring dashboard
